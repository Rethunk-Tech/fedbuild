name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Validate (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [devbox, bastion-edge, bastion-core]
        # Add new variants to this list as they land. Keep ordering stable for
        # deterministic CI run ordering.

    container:
      image: fedora:44

    env:
      ACTIONLINT_VERSION: 1.7.12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute cache week
        id: week
        run: echo "key=$(date +%Y-%W)" >> "$GITHUB_OUTPUT"

      - name: Cache dnf packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # dnf5's system_cachedir; /var/cache/dnf does not exist on Fedora 44.
          path: /var/cache/libdnf5
          key: dnf-f44-${{ steps.week.outputs.key }}-${{ hashFiles('.github/workflows/ci.yml', 'variants/*/blueprint.toml', 'variants/*/*-firstboot/SPECS/*.spec') }}
          restore-keys: |
            dnf-f44-${{ steps.week.outputs.key }}-
            dnf-f44-

      - name: Install build deps
        run: dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=True shellcheck rpmlint rpm-build systemd-rpm-macros git make yq systemd

      # Release binary: `go install` pulled golang from dnf for nothing else.
      - name: Cache actionlint
        id: actionlint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin actionlint

      - uses: Rethunk-Tech/gh-actions/setup-python@950fe676e8beb3854c98ac74bcf9951ad7cb7b7c # v1.12
        with:
          skip-install: "true"

      - name: Install check-jsonschema
        run: uv tool install check-jsonschema

      - name: Check (shellcheck + TOML + actionlint + check-versions + check-settings)
        run: make VARIANT=${{ matrix.variant }} check

      - name: Build RPM
        run: make VARIANT=${{ matrix.variant }} rpm

      - name: rpmlint
        run: make VARIANT=${{ matrix.variant }} lint

      - name: systemd-analyze security (advisory)
        # Advisory-only: prints exposure score for the firstboot unit.
        # Does not fail the build — hardening is constrained by sudo/Ruby/dnf needs.
        # --offline=true scores the file directly without loading it as a unit.
        continue-on-error: true
        run: |
          unit=$(find variants/${{ matrix.variant }} -name '*.service' | head -1)
          if [ -n "$unit" ]; then
            systemd-analyze security --offline=true --no-pager "$unit" || true
          else
            echo "no .service unit found in variants/${{ matrix.variant }}"
          fi

  fleet-version-check:
    name: Fleet check-versions-all
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimal deps
        run: dnf install -y --setopt=install_weak_deps=False make yq
      - name: check-versions-all
        run: make check-versions-all
